name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  php-unit:
    name: Run PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Add MongoDB variables to .env
        run: |
          echo "" >> .env
          echo "# Test MongoDB Configuration" >> .env
          echo "MONGODB_URL=mongodb://root:password@mongo:27017" >> .env
          echo "MONGODB_DB=regmel_nosql_test" >> .env

      - name: Start the aurora
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 10

      - name: Give permissions for var
        run: sudo chmod -R 777 var/

      - name: Create assets/uploads directory and give permissions
        run: mkdir -p assets/uploads && chmod -R 777 assets/uploads

      - name: Install dependencies
        run: docker compose exec -T --user root php composer install --ignore-platform-req=ext-mongodb

      - name: Remove test cache directory and force rebuild
        run: docker compose exec -T --user root php rm -rf var/cache/test

      - name: Generate public/private keys for use in your application.
        run: docker compose exec -T --user root php bin/console lexik:jwt:generate-keypair

      - name: Create the phpunit.xml
        run: docker compose exec -T --user root php cp phpunit.xml.dist phpunit.xml

      - name: Run migrations
        run: docker compose exec -T php bin/console d:m:migrate -n

      - name: Run fixtures
        run: docker compose exec -T php bin/console d:f:l -n --purge-exclusions=city --purge-exclusions=state

      - name: Start the PHPUnit
        run: |
          docker compose exec -T php bash -c "export DATABASE_URL=postgresql://regmel:password@regmel-postgres:5432/regmel_psql?serverVersion=16 && export MONGODB_URL=mongodb://root:password@mongo:27017 && export MONGODB_DB=regmel_nosql_test && bin/paratest --no-coverage"

      - name: Remove o .env file
        run: rm .env

  cypress:
    name: Run Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Add MongoDB variables to .env
        run: |
          echo "" >> .env
          echo "# Test MongoDB Configuration" >> .env
          echo "MONGODB_URL=mongodb://root:password@mongo:27017" >> .env
          echo "MONGODB_DB=regmel_nosql_test" >> .env

      - name: Start the aurora
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 10

      - name: Give permissions for var
        run: sudo chmod -R 777 var/

      - name: Create storage and give permissions
        run: mkdir -p storage && chmod -R 777 storage

      - name: Create folder assets/uploads
        run: mkdir -p assets/uploads && chmod -R 777 assets/uploads

      - name: Install application dependencies
        run: docker compose exec -T --user root php composer install --ignore-platform-req=ext-mongodb

      - name: Generate public/private keys for use in your application.
        run: docker compose exec -T --user root php bin/console lexik:jwt:generate-keypair

      - name: Run generate mongodb proxies
        run: docker compose exec -T --user root php bin/console doctrine:mongodb:generate:proxies

      - name: Run migrations
        run: docker compose exec -T --user root php bin/console d:m:migrate -n

      - name: Create admin users
        run: docker compose exec -T php bash -c "php bin/console app:create-admin-user"

      - name: Run demo regmel
        run: docker compose exec -T php bash -c "php bin/console app:demo-regmel"

      - name: Install frontend dependencies
        run: docker compose exec -T --user root php bin/console importmap:install

      - name: Compile frontend dependencies
        run: docker compose exec -T --user root php bin/console asset-map:compile

      - name: Run cypress
        run: docker compose run --rm cypress

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ./cypress/screenshots

      - name: Remove o .env file
        run: rm .env
