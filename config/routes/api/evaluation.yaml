get-evaluation:
  path: /proposals/{id}/evaluation
  controller: App\Controller\Api\EvaluationApiController::getEvaluation
  methods: ['GET']

evaluate:
  path: /proposals/{id}/evaluate
  controller: App\Controller\Api\EvaluationApiController::evaluate
  methods: ['POST']

upload-evaluation-document:
  path: /proposals/{id}/evaluation/document
  controller: App\Controller\Api\EvaluationApiController::uploadEvaluationDocument
  methods: ['POST']

get-proposals-awaiting-evaluation:
  path: /proposals/awaiting-evaluation
  controller: App\Controller\Api\EvaluationApiController::getProposalsAwaitingEvaluation
  methods: ['GET']
