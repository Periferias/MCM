{{- $exports := .Values.exports | default dict }}
{{- $persistence := $exports.persistence | default dict }}
{{- if $persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pvr.fullname" . }}-exports
  labels:
    {{- include "pvr.labels" . | nindent 4 }}
    component: exports
spec:
  accessModes:
    - {{ $persistence.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ $persistence.size | default "5Gi" }}
  {{- if $persistence.storageClass }}
  storageClassName: {{ $persistence.storageClass }}
  {{- end }}
{{- end }}
