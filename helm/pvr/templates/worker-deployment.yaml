{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pvr.fullname" . }}-worker
  labels:
    {{- include "pvr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "pvr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "pvr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pvr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: assets-volume
          {{- if .Values.appVolumes.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.appVolumes.persistence.assets.existingClaim | default (printf "%s-assets" (include "pvr.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: storage-volume
          {{- if .Values.appVolumes.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.appVolumes.persistence.storage.existingClaim | default (printf "%s-storage" (include "pvr.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: {{ .Chart.Name }}-worker
          volumeMounts:
            - mountPath: /app/assets/uploads
              name: assets-volume
            - mountPath: /app/var/storage
              name: storage-volume
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.php.image.pullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          env:
            - name: SERVER_NAME
              value: :80
            - name: DEFAULT_URI
              value: {{ include "pvr.fullname" . }}-https://localhost
            - name: TRUSTED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-trusted-hosts
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-trusted-proxies
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-app-env
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-app-debug
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-app-secret
            - name: CORS_ALLOW_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: php-cors-allow-origin
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: database-url
            {{- if or .Values.mongodb.enabled .Values.mongodb.url }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: mongodb-url
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: mongodb-db
            {{- end }}
            {{- if or .Values.redis.enabled .Values.redis.url }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: redis-url
            {{- end }}
            - name: CADDY_GLOBAL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: caddy-global-options
            - name: MAX_FILE_SIZE_MB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: max-file-size-mb
            - name: EMAIL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: email-address
            - name: MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvr.fullname" . }}
                  key: mailer-dsn
            - name: JWT_SECRET_KEY
              value: {{ .Values.jwt.secretKey | quote }}
            - name: JWT_PUBLIC_KEY
              value: {{ .Values.jwt.publicKey | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
